 // melody

// ---- Flytrap: live bezier stems + cached head frames ----
const FTD=.46,FTR=[[[7,-46,.95]],[[7,-48,1.1]],[[11,-50,1.05],[-14,-40,.85]]];
function ftHeads(t){if(!t.heads||t.heads.length!==FTR[t.lvl-1].length)t.heads=FTR[t.lvl-1].map(([x,y,s],i)=>({rx:x,ry:y,s,a:0,ang:i?-2.2:-.9,e:null,lx:0,ly:0,ph:i*2.1}));}
// strike curve: p 0..1 -> reach (0 rest,1 at bug) and jaw openness
function ftCurve(p){let r,o;if(p<.22){const q=p/.22;r=-.14*Math.sin(q*Math.PI/2);o=q;}else if(p<.42){const q=(p-.22)/.2;r=-.14+1.14*(1-Math.pow(1-q,3));o=1;}else if(p<.6){r=1-.04*Math.sin((p-.42)/.18*Math.PI);o=Math.max(0,1-(p-.42)/.04);}else{const q=(p-.6)/.4;r=1-ease.outBack(q);o=Math.min(.75,q*1.2);}return[r,o];}
function ftUpdate(t,dt){ftHeads(t);const bx=t.x,by=t.y+12;const near=G.enemies.filter(e=>e.hp>0&&e.d>0&&!e.fly&&Math.max(Math.abs(e.x-t.x),Math.abs(e.y-t.y))<T*2.2);
 t.heads.forEach((h,i)=>{h.ph+=dt;const hx=bx+h.rx,hy=by+h.ry;let want;
  if(h.a>0){h.a=Math.max(0,h.a-dt);if(h.e&&h.e.hp>0){h.lx=h.e.x;h.ly=h.e.y;}const p=1-h.a/FTD;want=Math.atan2(h.ly-6-hy,h.lx-hx);
   if(!h.hit&&p>=.43){h.hit=true;if(h.e&&h.e.hp>0){sfx('chomp');hurt(h.e,h.dmg,'flytrap');part({k:'chomp',x:h.e.x,y:h.e.y,t:0,life:.35});burst(h.e.x,h.e.y,['#5ccf52','#ff7088'],6,70);}}}
  else{const e=near.length?near.reduce((a,b)=>Math.hypot(a.x-hx,a.y-hy)<Math.hypot(b.x-hx,b.y-hy)?a:b):null;
   want=e?Math.atan2(e.y-6-hy,e.x-hx)+Math.sin(h.ph*3)*.08:(h.rx<0?-2.3:-.85)+Math.sin(h.ph*1.5)*.22;}
  let dA=Math.atan2(Math.sin(want-h.ang),Math.cos(want-h.ang));h.ang+=dA*Math.min(1,dt*(h.a>0?18:5));});}
function drawFlytrap(t,x,by,sc,preview){ftHeads(t);const L=t.lvl,sw=Math.sin(t.ph*1.6)*.05;ctx.save();ctx.translate(x,by);ctx.scale(sc,sc);
 ctx.save();ctx.rotate(sw*.5);spr(S['ftbody'+L],0,0);ctx.restore();
 const hs=t.heads.map(h=>{const p=h.a>0?1-h.a/FTD:0,[r,o]=h.a>0?ftCurve(p):[0,.75+.25*Math.sin(h.ph*2.2)];
  let hx=h.rx+Math.sin(h.ph*1.5)*2.2,hy=h.ry+Math.cos(h.ph*1.9)*1.6;
  if(h.a>0){const tx=(h.lx-x)/sc,ty=(h.ly-6-by)/sc,dx=tx-h.rx,dy=ty-h.ry,dl=Math.hypot(dx,dy)||1,reach=Math.max(0,dl-12*h.s);hx+=dx/dl*reach*r;hy+=dy/dl*reach*r;}
  const st=h.a>0?1+.12*Math.max(0,r):1;return{h,hx,hy,o,st};});
 for(const k of hs){const{h,hx,hy}=k,ca=Math.cos(h.ang),sa=Math.sin(h.ang),ex=hx-ca*10*h.s,ey=hy-sa*10*h.s;
  ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-22);ctx.bezierCurveTo(h.rx*.15,-22+(h.ry+22)*.55,ex-ca*22,ey-sa*22,ex,ey);
  ctx.strokeStyle='#1d4a14';ctx.lineWidth=7.5;ctx.stroke();ctx.strokeStyle='#4caa3a';ctx.lineWidth=4.6;ctx.stroke();ctx.strokeStyle='rgba(200,255,150,.5)';ctx.lineWidth=1.3;ctx.stroke();}
 for(const k of hs){const{h,hx,hy,o,st}=k;ctx.save();ctx.translate(hx,hy);ctx.rotate(h.ang);if(Math.cos(h.ang)<0)ctx.scale(1,-1);const s=h.s*st;spr(S[`fthead${L}_${Math.round(Math.max(0,Math.min(1,o))*(FTF-1))}`],0,0,s,s);ctx.restore();}
 ctx.restore();}
