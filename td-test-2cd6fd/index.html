function specialText(k){const d=TOWERS[k];switch(k){
 case 'flytrap':return 'At Lv3 it grows a second, winged head that bites flyers — the air head goes first. Only one head strikes at a time.';
 case 'frog':return 'Its long sticky tongue snatches flyers right out of the air.';
 case 'gnome':return 'Splash: when a pebble lands, other ground bugs within '+(d.splash||.75)+' squares of the hit take 60% damage too.';
 case 'mantis':return 'Instant slice — the hit lands straight away, with no travel time.';
 case 'dandelion':return 'Cheap and very fast. It shoots flyers before ground bugs, so it is great filler against flyers.';
 case 'hedgehog':return 'It claims up to '+d.cap.join('/')+' ground bugs in range (Lv1/2/3). Claimed bugs crawl at '+d.stallF.map(v=>Math.round(v*100)+'%').join('/')+' speed while in range and get poked. The Slug King boss resists: never slower than about 78%/70%/63% speed. Flyers are untouched.';
 case 'zapper':return 'Lightning chains to up to '+(d.chain||4)+' bugs. Each jump deals 50% of the previous hit. It does the same damage to every bug type, so it is a good answer to shelled bugs. Does double damage while the Sprinkler is running — wet bugs conduct!';
 case 'spider':return 'Every web hit slows that bug by 45% for '+(d.slow||1.6)+' seconds. The slow works even on shelled bugs — shells do not stop it.';
 case 'firefly':return 'Always-on aura, range '+d.range+': hidden bugs inside are revealed and Lit, so they take +'+d.lit.map(v=>Math.round(v*100)+'%').join('/')+' damage from all sources (Lv1/2/3). Defenses within 2 squares attack '+d.buff.map(v=>Math.round(v*100)+'%').join('/')+' faster. Its glow hit keeps a bug Lit for 1.2 seconds.';
 case 'dragon':return 'Huge 2x2 body — it needs 2x2 free grass to plant. It bites up to '+(d.cleave||4)+' ground bugs at once in the 2-square strip ahead of where it faces.';
 case 'bat':return 'Echolocation pulse every '+d.pulseCd.join('/')+'s (Lv1/2/3): hidden bugs within '+d.range+' squares are revealed and Lit for '+d.pulseDur.join('/')+'s, so they can be targeted (ground and air). Between pulses hidden bugs can hide again. Its screech hits flyers only. Firefly still gives steadier ground+air light.';
 case 'owl':return 'Always-on reveal, range '+d.range+' (bigger than Firefly): hidden ground and air bugs inside are revealed and Lit (+'+d.lit.map(v=>Math.round(v*100)+'%').join('/')+' damage taken). It swoops flyers only — no ground damage.';
 case 'horseradish':return 'MANUAL FIRE ONLY — it never fires by itself. Tap a READY Mortar (gold ring, “READY – tap!”), then tap anywhere on the board to lob a root there. Reload: '+d.mortarReload.join('/')+'s (Lv1/2/3) — you tap to fire each shot, and it holds READY forever until you tap. The root flies for about 0.5–1.0s, so lead moving bugs! Splash: the bug closest to the landing spot takes full damage, other ground bugs within '+d.splash+' square take '+Math.round(d.splashPct*100)+'%. Blunt cracks shelled bugs like Snail, Stink Bug and Beetle. Placeable on any empty build tile, even decor tiles (never on the path). To upgrade it, tap it while it is reloading to open its panel.';
 case 'monarch':return 'NO damage. Aura: defenses within '+d.auraR.join('/')+' squares (Lv1/2/3) attack '+d.buffSpd.map(v=>Math.round(v*100)+'%').join('/')+' faster. Stacks with Firefly, but all speed buffs together are capped at +50%.';
 case 'sundew':return 'When it snaps, one ground bug is HELD still for '+d.holdDur.join('/')+'s (Lv1/2/3) and takes tiny damage. Bosses resist: holds last only 35% as long on them. Other defenses can freely hit the held bug.';
 case 'compost':return 'NO damage. Bugs popped within '+d.range+' squares drop bonus coins: +'+d.ecoPct.map(v=>Math.round(v*100)+'%').join('/')+' of their coin value (Lv1/2/3). Bins STACK (v9.21): every bin covering a kill adds its bonus — two Lv1 bins give +60% on that kill. No cap in this mock.';

 default:return '';}}

let DEVHOLD=null;
function devHoldTarget(x,y){
 if(screen!=='title'||DEV.panel)return false;
 return (x>=LOGO.x&&x<=LOGO.x+LOGO.w&&y>=LOGO.y&&y<=LOGO.y+LOGO.h)||(x>=VER.x&&x<=VER.x+VER.w&&y>=VER.y&&y<=VER.y+VER.h);
}
function clearDevHold(){if(DEVHOLD){clearTimeout(DEVHOLD);DEVHOLD=null;}}
cv.addEventListener('pointerdown',ev=>{
 try{
  const[x,y]=evXY(ev);

   clearDevHold();

  }

},true);
